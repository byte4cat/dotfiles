r add video-rotate 90
R add video-rotate -90

l seek  5                          # 往後 5 秒
h seek -5                          # 往前 5 秒
k seek -60                         # 往前 1 分鐘
j seek  60                         # 往後 1 分鐘
f cycle fullscreen                 # 切換全螢幕
q quit                             # 退出

Ctrl+] add volume 2
Ctrl+[ add volume -2


# 播放清單操作
; show-text "${playlist}"         # 顯示目前播放清單


# 當檔案被拖進視窗時，加入清單並立刻跳到該檔案播放
# DRAG_AND_DROP loadfile "${drag-and-drop-target}" append-play
