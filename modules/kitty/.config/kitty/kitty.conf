# vim:fileencoding=utf-8:foldmethod=marker
term xterm-kitty

#: --- 核心快捷鍵設定 ---
# 強制送出 Ctrl+Shift+h/j/k/l 給 Neovim (用於導航)
map ctrl+shift+h send_text all \x1b[72;6u
map ctrl+shift+j send_text all \x1b[74;6u
map ctrl+shift+k send_text all \x1b[75;6u
map ctrl+shift+l send_text all \x1b[76;6u

# 滾動與功能綁定
map ctrl+shift+z show_scrollback
# map ctrl+shift+f launch --type=overlay zsh -c '~/.local/bin/byte4work-tmux-sessionizer'
map kitty_mod+f5 combine : load_config_file : launch --type=overlay sh -c 'echo "kitty config reloaded."; echo; read -r -p "Press Enter to exit"; echo ""'

#: --- 字體與渲染 (優化顯示效果) ---
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        20.0

# 針對 9950X 提高對比度與清晰度，減少「灰感」
text_composition_strategy 1.2 30
modify_font thickness 100%
disable_ligatures never

#: --- 顏色與外觀 (解決背景灰問題) ---
# 確保絕對純黑
# background #000000
# foreground #ffffff
background_opacity 1.0
dynamic_background_opacity no

# 關閉會干擾純色的設定
background_tint 0.0
background_blur 0
background_image none

# 視窗裝飾
hide_window_decorations yes
remember_window_size  yes
initial_window_width  100c
initial_window_height 30c

#: --- 性能優化 (針對 9950X 降低延遲) ---
repaint_delay 8
input_delay 1
sync_to_monitor yes

#: --- 警示音與標籤頁 (解決打錯字噴音效) ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab "🔔 "

# 標籤頁樣式
tab_bar_style hidden
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{'🇿' if layout_name == 'stack' and num_windows > 1 else ''}{title}"

#: --- 滑鼠與捲動 ---
mouse_hide_wait 3.0
url_style curly
detect_urls yes
show_hyperlink_targets yes
copy_on_select yes
paste_actions quote-urls-at-prompt
scrollback_lines 10000

#: --- 字體縮放 (快速鍵) ---
map cmd+plus   change_font_size all +2.0
map cmd+minus  change_font_size all -2.0
map cmd+0      change_font_size all 0

#: --- 標籤頁跳轉 ---
# map cmd+1 goto_tab 1
# map cmd+2 goto_tab 2
# map cmd+3 goto_tab 3
# map cmd+4 goto_tab 4
# map cmd+5 goto_tab 5
# map cmd+6 goto_tab 6
# map cmd+7 goto_tab 7
# map cmd+8 goto_tab 8
# map cmd+9 goto_tab 9

#: --- 其他進階設定 ---
allow_remote_control yes
macos_quit_when_last_window_closed no

# 主題

# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME
