#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# fix screensharing on wayland with pipewire
exec = xdg-desktop-portal-wlr

# exec-once = nm-applet &
exec-once = hyprpaper
exec-once = waybar
exec-once = fcitx5
exec-once = wl-paste --type text --watch cliphist store
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = xhost +SI:localuser:root
exec-once = swayosd-server

# exec-once = [workspace special:terminal silent] $terminal
# exec-once = [workspace special:spotify silent] spotify
# exec-once = [workspace special:vesktop silent] vesktop
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] $browser
