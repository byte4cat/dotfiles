image {
    monitor = DP-1
    path = ~/.local/share/hypr/lock/images/user.png
	size = 100
	rounding = -1
	border_size = 2
	border_color = rgba(255, 255, 255, 1)
	rotate = 0
	#reload_time = -1
	#reload_cmd =
	# position = 0,-25
    position = 0%,-30%
	halign = center
	valign = center
}

# 輸入欄位
input-field {
    monitor = DP-1
    size = 8%, 3%
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = 2 # 輕微圓角
    outer_color = rgba(255, 255, 255, 0.1) # 輕微的外部輪廓提示
    inner_color = rgba(0, 0, 0, 0.4) # 半透明黑色輸入背景
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    placeholder_text = <i> Type your secure password... </i>
    hide_input = true # 隱藏輸入，更安全
    rounding = 8 # 增加圓角
    check_color = rgba(50, 200, 50, 0.8) # 成功時綠色提示
    fail_color = rgba(255, 50, 50, 0.8) # 失敗時紅色提示
    fail_text = <i> Invalid Password! </i>
    position = 0%, 10% # 移到中央下方
    halign = center
    valign = bottom
}

label {
    monitor = DP-1
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = rgba(255, 255, 255)
    font_size = 24
    font_family = Noto Sans 10

    position = 0, -300
    halign = center
    valign = top
}

label {
    monitor = DP-1
    # text = cmd[update:30000] echo "<b><big> $(date +"%I:%M %p") </big></b>" # AM/PM
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>" # 24H
    color = rgba(255, 255, 255)
    font_size = 94
    font_family = Noto Sans 10

    position = 0, -100
    halign = center
    valign = top
}

