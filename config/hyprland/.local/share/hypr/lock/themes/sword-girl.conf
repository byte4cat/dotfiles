$font = Monospace

general {
	disable_loading_bar = true
	hide_cursor = true
    grace = 0
	no_fade_in = false
	no_fade_out = false
	ignore_empty_input = false
	pam_module = hyprlock
	text_trim = true
	immediate_render = true
	fractional_scaling = 1
	fail_timeout = 0.1
}

background {
    monitor =
    path = ~/.local/share/hypr/lock/images/sword-girl-bg-01.jpg
	color = rgba(0, 0, 0, 0)
    blur_passes = 0
    blur_size = 4
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}


