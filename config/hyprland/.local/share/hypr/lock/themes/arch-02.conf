$font = Monospace

general {
	disable_loading_bar = true
	hide_cursor = true
    grace = 0
	no_fade_in = false
	no_fade_out = false
	ignore_empty_input = false
	pam_module = hyprlock
	text_trim = true
	immediate_render = true
	fractional_scaling = 1
	fail_timeout = 0.1
}

background {
    monitor =
    path = ~/.local/share/hypr/lock/images/arch-02-bg.png
	color = rgba(0, 0, 0, 0)
    blur_passes = 0
    blur_size = 4
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

image {
    monitor = DP-1
    path = ~/.local/share/hypr/lock/images/user.png
	size = 100
	rounding = -1
	border_size = 2
	border_color = rgba(255, 255, 255, 1)
	rotate = 0
	#reload_time = -1
	#reload_cmd =
	# position = 0,-25
    position = 0%,-30%
	halign = center
	valign = center
}

shape {
    monitor = DP-1
    size = 8%, 3%          # 寬 40%，高 8%，長寬比決定橢圓扁度
    border_size = 0
    border_color = rgba(0,0,0,0)
    color = rgba(0,0,0,0.3)  # 半透明黑色
    rounding = -1            # 自動圓角成橢圓
    position = 0,10%         # 往下偏移 35%（與 input-field 對齊）
    halign = center
    valign = bottom
}

input-field {
    monitor = DP-1
    size = 8%, 3%
    outline_thickness = 0
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
	dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
	fade_timeout = 1
    placeholder_text = <i> Enter Password </i>
    hide_input = false
	rounding = -1
	check_color = rgba(0, 0, 0, 0)
	fail_color = rgba(255, 0, 0, 0.8)
	fail_text = <i> Authentication Failure </i>
	fail_transition = 10
	capslock_color = -1
	numlock_color = -1
	bothlock_color = -1
	invert_numlock = false
	swap_font_color = false
    position = 0%,10%
    halign = center
    valign = bottom
}

label {
    monitor = DP-1
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = rgba(255, 255, 255)
    font_size = 24
    font_family = Noto Sans 10

    position = 0, -300
    halign = center
    valign = top
}

label {
    monitor = DP-1
    # text = cmd[update:30000] echo "<b><big> $(date +"%I:%M %p") </big></b>" # AM/PM
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>" # 24H
    color = rgba(255, 255, 255)
    font_size = 94
    font_family = Noto Sans 10

    position = 0, -100
    halign = center
    valign = top
}

