$font = sans-serif # 更現代的無襯線字體

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    pam_module = hyprlock
    text_trim = true
    immediate_render = true
    fail_timeout = 0.1
}

# 簡約背景：純深藍色，帶輕微模糊
background {
    monitor =
    path =
    color = rgba(20, 25, 40, 1) # 深藍色調
    blur_passes = 3 # 增加模糊程度
    blur_size = 7
    noise = 0.01
    contrast = 1.0
    brightness = 0.8 # 略微降低亮度
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# 用戶頭像：居中並放在中央上方
image {
    monitor = DP-1
    path = ~/.local/share/hypr/lock/images/user.png
    size = 120 # 稍大一點
    rounding = -1
    border_size = 4
    border_color = rgba(255, 255, 255, 0.4) # 半透明白色邊框
    position = 0%,-15% # 向上移動
    halign = center
    valign = center
}

# 輸入欄位：更寬、更低調，不再需要額外的 shape 區塊
input-field {
    monitor = DP-1
    size = 20%, 3.5% # 更寬的輸入框
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = 2 # 輕微圓角
    outer_color = rgba(255, 255, 255, 0.1) # 輕微的外部輪廓提示
    inner_color = rgba(0, 0, 0, 0.4) # 半透明黑色輸入背景
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    placeholder_text = <i> Type your secure password... </i>
    hide_input = true # 隱藏輸入，更安全
    rounding = 8 # 增加圓角
    check_color = rgba(50, 200, 50, 0.8) # 成功時綠色提示
    fail_color = rgba(255, 50, 50, 0.8) # 失敗時紅色提示
    fail_text = <i> Invalid Password! </i>
    position = 0%, 15% # 移到中央下方
    halign = center
    valign = center
}

# 標籤一：日期 (較小)
label {
    monitor = DP-1
    text = cmd[update:18000000] echo "$(date +'%A, %B %d, %Y')"
    color = rgba(200, 200, 200, 1) # 灰色字體
    font_size = 20
    font_family = $font

    position = 0, -5% # 移到頭像和時間之間
    halign = center
    valign = center
}

# 標籤二：時間 (最大、最突出)
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>" # 24H
    color = rgba(255, 255, 255, 1) # 白色字體
    font_size = 24 # 巨大字體
    font_family = $font

    position = 0, -35% # 移到螢幕中央上方
    halign = center
    valign = center
}

# 標籤三：提示 (額外的底部文字)
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b>System Locked</b>"
    color = rgba(150, 150, 150, 0.6)
    font_size = 18
    font_family = $font

    position = 0, -5%
    halign = center
    valign = bottom
}
