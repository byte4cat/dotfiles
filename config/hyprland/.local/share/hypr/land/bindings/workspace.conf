##################
### WORKSPACES ###
##################
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

workspace = special:terminal, on-created-empty:[float]$terminal
workspace = special:spotify, on-created-empty:[tiled]spotify
workspace = special:workmsg, on-created-empty:[tiled]$workmsg
workspace = special:baby, on-created-empty:[tiled]$babycam

############################
### SubMap - scratchpad ###
############################

bind = $mainMod, P, submap, scratchpad

submap = scratchpad

# 切換 (Toggle) 各種 Workspace
binde = , S, togglespecialworkspace, 'unknown-01'
binde = , P, togglespecialworkspace, spotify
binde = , B, togglespecialworkspace, babycam
binde = , D, togglespecialworkspace, workmsg
binde = , A, togglespecialworkspace, terminal
binde = , X, togglespecialworkspace, 'unknown-02'

binde = SHIFT, S, movetoworkspace, special:'unknown-01'
binde = SHIFT, P, movetoworkspace, special:spotify
binde = SHIFT, B, movetoworkspace, special:babycam
binde = SHIFT, D, movetoworkspace, special:workmsg
binde = SHIFT, A, movetoworkspace, special:terminal
binde = SHIFT, X, movetoworkspace, special:'unknown-02'

bind = , escape, submap, reset
bind = , catchall, submap, reset # any key to exit

submap = reset
