##################
### WORKSPACES ###
##################
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:HDMI-A-1

workspace = special:scratchpad-term, on-created-empty:[float]$terminal -e bash -c "tmux new-session -A -s scratchpad; exec bash"
workspace = special:music, on-created-empty:[tiled]$music
workspace = special:work-msg, on-created-empty:[tiled]$work_msg
workspace = special:personalmsg, on-created-empty:[tiled]$personal_msg

#########################
### Special Workspace ###
#########################
bind = $mainMod, S, togglespecialworkspace, work-msg
bind = $mainMod SHIFT, S, movetoworkspace, special:work-msg

# force focus primary monitor and workspace when toggling music workspace
bind = $mainMod, V, focusmonitor, $PRIMARY_MONITOR
bind = $mainMod, V, togglespecialworkspace, music

bind = $mainMod, X, togglespecialworkspace, personal-msg
bind = $mainMod SHIFT, X, movetoworkspace, special:personal-msg

# force focus primary monitor when toggling scratchpad workspace
bind = $mainMod, A, focusmonitor, $PRIMARY_MONITOR
bind = $mainMod, A, togglespecialworkspace, scratchpad-term
