$mainMod = SUPER # Sets "Windows" key as main modifier
$secMod = ALT # Sets "Alt" key as secondary modifier

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec,  $terminal
bind = $mainMod, Q, killactive,
# bind = $mainMod, M, exec, wlogout -p layer-shell
bind = $mainMod, M, exec, byte4work-wofi-power-menu
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, E, exec, $emoji_picker
bind = $mainMod, E, exec, $terminal_file_manager
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, R, exec, pkill glint; pkill swayosd-server; byte4work-launch-waybar & swayosd-server & glint &
bind = $mainMod, F, fullscreen,
bind = $mainMod, D, exec, $menu --show drun --prompt "Search Apps"
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, N, cyclenext, # cycle to the next window
bind = $mainMod SHIFT, N, exec, swaync-client -t # toggle
# quick menu
bind = $mainMod, C, exec, byte4work-wofi-quick-menu
bind = $mainMod, W, exec, byte4work-waypaper-theme-switcher
# open babycam
bind = $mainMod SHIFT, B, exec, byte4work-babycam

bind = $mainMod SHIFT, P, exec, byte4work-hyprland-toggle-pin

# clipboard management, requires cliphist and wl-copy, its a simple script that lists the clipboard history and allows you to select an entry to copy it back to the clipboard
# bind = $mainMod $secMod, C, exec, $menu -m clipboard
bind = $mainMod $secMod, C, exec, byte4work-wofi-clipboard

# group, like i3 tab
bind = $mainMod, G, togglegroup,
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup,

# Resize window with mainMod + CTRL + SHIFT + HJKL
binde = $mainMod CONTROL SHIFT, H, resizeactive, -30 0, l
binde = $mainMod CONTROL SHIFT, J, resizeactive, 0 30, r
binde = $mainMod CONTROL SHIFT, K, resizeactive, 0 -30, u
binde = $mainMod CONTROL SHIFT, L, resizeactive, 30 0, d

# Resize window with mainMod + CTRL + SHIFT + HJKL
binde = $mainMod CONTROL SHIFT, H, resizeactive, -30 0
binde = $mainMod CONTROL SHIFT, J, resizeactive, 0 30
binde = $mainMod CONTROL SHIFT, K, resizeactive, 0 -30
binde = $mainMod CONTROL SHIFT, L, resizeactive, 30 0

# Move window in current workspace
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


# Switch workspace using mainMod + RIGHT/LEFT arrow key
bind = $mainMod, RIGHT, workspace, +1
bind = $mainMod, LEFT, workspace, -1

binds {
    allow_workspace_cycles = true
}

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# enter resize mode
bind = $mainMod, R, submap, resize
# submap
submap = resize

binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0

bind = , escape, submap, reset
bind = , Return, submap, reset

# end submap
submap = reset

# # Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# # Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --input-volume mute-toggle

# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --brightness up
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --brightness down

# --- HHKB Win Mode volume control ---
# SUPER + [ ] \
# e for repeat, long press

# Volume up (SUPER + ])
bindel = SUPER, bracketright, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --output-volume raise

# Volume down (SUPER + [ )
bindel = SUPER, bracketleft, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --output-volume lower

# Volume mute (SUPER + \ ), make sure you disable fictx `quick phrase in addons`
bindel = SUPER, backslash, exec, swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')" --output-volume mute-toggle


##################
### WORKSPACES ###
##################
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:HDMI-A-1

workspace = special:scratchpad-term, on-created-empty:[float]$terminal -e bash -c "tmux new-session -A -s scratchpad; exec bash"
workspace = special:music, on-created-empty:[tiled]$music
workspace = special:work-msg, on-created-empty:[tiled]$work_msg
workspace = special:personalmsg, on-created-empty:[tiled]$personal_msg
workspace = special:temp

#########################
### Special Workspace ###
#########################
bind = $mainMod, S, togglespecialworkspace, work-msg
bind = $mainMod SHIFT, S, movetoworkspace, special:work-msg

bind = $mainMod, O, togglespecialworkspace, temp
bind = $mainMod SHIFT, O, movetoworkspace, special:temp

# force focus primary monitor and workspace when toggling music workspace
bind = $mainMod, V, focusmonitor, $PRIMARY_MONITOR
bind = $mainMod, V, togglespecialworkspace, music

bind = $mainMod, X, togglespecialworkspace, personal-msg
bind = $mainMod SHIFT, X, movetoworkspace, special:personal-msg

# force focus primary monitor when toggling scratchpad workspace
bind = $mainMod, A, focusmonitor, $PRIMARY_MONITOR
bind = $mainMod, A, togglespecialworkspace, scratchpad-term




##################
### Screenshot ###
##################

env = HYPRSHOT_DIR, $HOME/Pictures/Screenshots
env = SCREENSHOT_DIR, $HOME/Pictures/Screenshots

# 截圖整個螢幕 (Ctrl+1)
bind = $mainMod CTRL, 1, exec, grim - | tee $SCREENSHOT_DIR/$(date +'%Y%m%d-%H%M%S').png | wl-copy && notify-send "Screenshot saved & copied"
# 截圖視窗 (Ctrl+2)
bind = $mainMod CTRL, 2, exec, grim -g "$(slurp)" - | tee $SCREENSHOT_DIR/$(date +'%Y%m%d-%H%M%S').png | wl-copy && notify-send "Screenshot saved & copied"
# 截圖區域 (Ctrl+3)
bind = $mainMod CTRL, 3, exec, grim -g "$(slurp)" - | tee $SCREENSHOT_DIR/$(date +'%Y%m%d-%H%M%S').png | wl-copy && notify-send "Screenshot saved & copied"

# --- Screenshot (Edit with Satty) ---
# 截圖整個螢幕並用 satty 編輯 (Ctrl+Shift+1)
bind = $mainMod CTRL SHIFT, 1, exec, grim - | satty --filename - --fullscreen --output-filename $SCREENSHOT_DIR/$(date +'%Y%m%d-%H%M%S').png
# 截圖視窗並用 satty 編輯 (Ctrl+Shift+2)
bind = $mainMod CTRL SHIFT, 2, exec, grim -g "$(slurp)" - | satty --filename - --output-filename $SCREENSHOT_DIR/$(date +'%Y%m%d-%H%M%S').png
# 截圖選取區域並用 satty 編輯 (Ctrl+Shift+3)
bind = $mainMod CTRL SHIFT, 3, exec, grim -g "$(slurp)" - | satty --filename - --output-filename $SCREENSHOT_DIR/$(date +'%Y%m%d-%H%M%S').png

###################
### Zoom In/Out ###
###################

# Mouse wheel
bind = $mainMod, mouse_up, exec, hyprctl keyword cursor:zoom_factor 0.8
bind = $mainMod, mouse_down,   exec, hyprctl keyword cursor:zoom_factor 1.2

# Keyboard shortcuts
binde = $mainMod, equal,      exec, hyprctl keyword cursor:zoom_factor 1.5
binde = $mainMod, minus,      exec, hyprctl keyword cursor:zoom_factor 1.0

# Keypad
# binde = $mainMod, KP_ADD,      exec, hyprctl keyword cursor:zoom_factor 1.5
# binde = $mainMod, KP_SUBTRACT, exec, hyprctl keyword cursor:zoom_factor 1.0

# Reset
bind = $mainMod SHIFT, 0, exec, hyprctl keyword cursor:zoom_factor 1
