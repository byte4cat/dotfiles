# ----------------------------------------------------
# 1. 設定全域視窗透明度 (針對所有應用程式)
# ----------------------------------------------------

windowrulev2 = opacity 1.0 1.0 1.0, fullscreen:1

# 格式: windowrulev2 = opacity <活動視窗不透明度> <非活動視窗不透明度>, <視窗識別碼>

# 預設所有視窗 (識別碼為 "regular" 或留空)
# 這裡將所有視窗設定為 90% 不透明 (10% 透明)

# 視窗透明度 (Opacity) 規則

windowrulev2 = opacity 0.95 0.95, title:.*
windowrulev2 = opacity 0.95 0.95, class:.*

# Terminal
windowrulev2 = opacity 0.85 0.85, class:^(com.mitchellh.ghostty)$

# Browsers
windowrulev2 = opacity 1.0 1.0, class:^(firefox)$
windowrulev2 = opacity 1.0 1.0, class:^(brave-browser)$
windowrulev2 = opacity 1.0 1.0, class:^(google-chrome)$
windowrulev2 = opacity 1.0 1.0, class:^(chromium)$

# Media Players
windowrulev2 = opacity 1.0 1.0, class:^(mpv)$
windowrulev2 = opacity 1.0 1.0, class:^(vlc)$

# Others
windowrulev2 = opacity 1.0 1.0, class:^(waypaper)$
windowrulev2 = opacity 1.0 1.0, class:^(vesktop)$
windowrulev2 = opacity 1.0 1.0, class:^(gimp)$
windowrulev2 = opacity 1.0 1.0, class:^(qimgv)$
windowrulev2 = opacity 1.0 1.0, class:^(zoom)$
windowrulev2 = opacity 1.0 1.0, class:^(anydesk)$
