# 設定全域 fullscreen 視窗透明度
windowrule {
    name = global-fullscreen-transparent
    match:class = .*
    opacity = 1.0 override 1.0 override
}

# All 視窗設定
windowrule {
    name = global-transparent
    match:class = .*
    opacity = 0.90 override 0.90 override
}

# Terminal
windowrule {
    name = terminal-transparent
    match:class = ^(com.mitchellh.ghostty|Alacritty|kitty)$
    opacity = 0.80 override 0.80 override
}

# vscode tools
windowrule {
    name = vscode-transparent
    match:class = ^(code-oss)$
    opacity = 0.98 override 0.98 override
}

# Browsers
windowrule {
    name = browser-transparent
    match:class = ^(firefox|brave-browser|google-chrome|chromium|zen)$
    opacity = 1.0 override 1.0 override
}

# Media Players
windowrule {
   name = media-transparent
    match:class = ^(mpv|vlc)$
    opacity = 1.0 override 1.0 override
}

# Others
windowrule {
    name = apps-transparent
    match:class = ^(waypaper|vesktop|gimp|qimgv|zoom|anydesk|amdgpu_top|steam|MongoDB Compass|chrome-ophjlpahpchlmihnnnihgmmeilfjmjjc-Default|brave-ophjlpahpchlmihnnnihgmmeilfjmjjc-Default|virt-manager|Freelens|org.remmina.Remmina)$
    opacity = 1.0 override 1.0 override
}
