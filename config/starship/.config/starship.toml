"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# 這裡移除了 \$username 和 \$hostname，徹底解決 Email 問題
# 同時只保留你真正關心的開發語言
format = """
$os\
$directory\
$git_branch\
$git_status\
$golang\
$rust\
$nodejs\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bold white"

[os.symbols]
Arch = "󰣇 "

[directory]
style = "bold cyan"
truncation_length = 3
fish_style_pwd_dir_length = 1

[hostname]
disabled = true

[username]
disabled = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[❮](bold purple)"

[git_branch]
symbol = " "
style = "bold yellow"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 500
style = "yellow"
