[env]
TERM = "xterm-256color"

[font]
size = 14

[font.normal]
family = "Comic Code"
style = "Regular"


[font.bold]
family = "Comic Code"
style = "bold"

[mouse]
hide_when_typing = true

[scrolling]
history = 50000
multiplier = 20

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 1.0
startup_mode = "Maximized"

[window.padding]
x = 5
y = 0

[general]
live_config_reload = true

[keyboard]
bindings = [
]

[selection]
save_to_clipboard = true
